version: '3.8'

services:
  # 1. Nossa Aplicação em TypeScript
  app:
    build: .
    container_name: poc_app
    ports:
      - "8080:8080"
    volumes:
      - /tmp:/tmp # Compartilha a pasta /tmp para manter o controle dos arquivos de trava

  # 2. Servidor do Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: poc_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml

  # 3. Painel do Grafana
  grafana:
    image: grafana/grafana:latest
    container_name: poc_grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus